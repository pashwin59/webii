<!DOCTYPE html>
<html>
<head>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<button id="btn">Click Me</button>
<p id="text">Hello World</p>

<script>
$(document).ready(function(){
    $("#btn").click(function(){
        $("#text").text("jQuery is Easy!");
    });
});
</script>

</body>
</html>

<!-- Create a Page with a button with the value "Computer" on clicking the button your page should be" Computer
Science" -->

<!DOCTYPE html>
<html>
<head>
    <title>Button Click Example</title>
</head>
<body>

    <h2 id="text">Computer</h2>

    <button onclick="changeText()">Computer</button>

    <script>
        function changeText() {
            document.getElementById("text").innerHTML = "Computer Science";
        }
    </script>

</body>
</html>
